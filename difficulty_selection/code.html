<!-- Header Area -->
<div class="flex flex-col gap-2 items-center text-center animate-fade-in-up">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-2 shadow-sm">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">psychology_alt</span>
</div>
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface">How challenging?</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Pick a difficulty level to start your session.</p>
</div>
<!-- Cards Container -->
<div class="flex flex-col gap-4 flex-1 mt-4" id="difficulty-options">
<!-- Easy Option -->
<button aria-pressed="false" class="difficulty-card group relative w-full flex flex-row items-center gap-4 p-5 rounded-2xl bg-surface-container-lowest shadow-sm hover:shadow-md transition-all duration-300 transform scale-100 outline-none select-none text-left" data-active-bg="bg-tertiary-container" data-active-text="text-on-tertiary-container" data-icon-bg="bg-tertiary" data-icon-text="text-on-tertiary" data-level="easy">
<div class="icon-container w-14 h-14 rounded-full bg-surface-container flex items-center justify-center transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-tertiary transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="title-text font-headline-md text-headline-md text-on-surface transition-colors duration-300">Easy</h3>
<p class="desc-text font-body-md text-body-md text-on-surface-variant truncate transition-colors duration-300">Fun and foundational.</p>
</div>
<div class="selection-indicator opacity-0 transform scale-50 transition-all duration-300 absolute right-6 text-tertiary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Medium Option -->
<button aria-pressed="false" class="difficulty-card group relative w-full flex flex-row items-center gap-4 p-5 rounded-2xl bg-surface-container-lowest shadow-sm hover:shadow-md transition-all duration-300 transform scale-100 outline-none select-none text-left" data-active-bg="bg-secondary-container" data-active-text="text-on-secondary-container" data-icon-bg="bg-secondary" data-icon-text="text-on-secondary" data-level="medium">
<div class="icon-container w-14 h-14 rounded-full bg-surface-container flex items-center justify-center transition-colors duration-300 shrink-0">
<div class="flex">
<span class="material-symbols-outlined text-secondary transition-colors duration-300 -mr-2" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-secondary transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="title-text font-headline-md text-headline-md text-on-surface transition-colors duration-300">Medium</h3>
<p class="desc-text font-body-md text-body-md text-on-surface-variant truncate transition-colors duration-300">A balanced challenge.</p>
</div>
<div class="selection-indicator opacity-0 transform scale-50 transition-all duration-300 absolute right-6 text-secondary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Hard Option -->
<button aria-pressed="false" class="difficulty-card group relative w-full flex flex-row items-center gap-4 p-5 rounded-2xl bg-surface-container-lowest shadow-sm hover:shadow-md transition-all duration-300 transform scale-100 outline-none select-none text-left" data-active-bg="bg-error-container" data-active-text="text-on-error-container" data-icon-bg="bg-error" data-icon-text="text-on-error" data-level="hard">
<div class="icon-container w-14 h-14 rounded-full bg-surface-container flex items-center justify-center transition-colors duration-300 shrink-0">
<div class="flex">
<span class="material-symbols-outlined text-error transition-colors duration-300 -mr-2" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-error transition-colors duration-300 -mr-2" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-error transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="title-text font-headline-md text-headline-md text-on-surface transition-colors duration-300">Hard</h3>
<p class="desc-text font-body-md text-body-md text-on-surface-variant truncate transition-colors duration-300">Mastery level review.</p>
</div>
<div class="selection-indicator opacity-0 transform scale-50 transition-all duration-300 absolute right-6 text-error">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-auto pt-8 pb-4 sticky bottom-0 z-10 bg-gradient-to-t from-surface via-surface to-transparent">
<button class="w-full h-14 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md transition-all duration-300 flex items-center justify-center gap-2 relative overflow-hidden shadow-none active:scale-[0.98]" disabled="" id="start-btn">
<span class="relative z-10 flex items-center gap-2">
                Start Review
                <span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</span>
</button>
</div>
</div>
<style>
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
    }
    
    /* Press effect for tactile feel */
    .difficulty-card:active {
        transform: scale(0.98);
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.difficulty-card');
        const startBtn = document.getElementById('start-btn');
        let selectedLevel = null;

        function resetCardStyles(card) {
            const activeBg = card.getAttribute('data-active-bg');
            const activeText = card.getAttribute('data-active-text');
            const iconBg = card.getAttribute('data-icon-bg');
            const iconText = card.getAttribute('data-icon-text');
            
            // Revert Container
            card.classList.remove(activeBg, 'shadow-md');
            card.classList.add('bg-surface-container-lowest', 'shadow-sm');
            
            // Revert Text
            const title = card.querySelector('.title-text');
            const desc = card.querySelector('.desc-text');
            title.classList.remove(activeText);
            title.classList.add('text-on-surface');
            desc.classList.remove(activeText);
            desc.classList.add('text-on-surface-variant');

            // Revert Icon Container
            const iconContainer = card.querySelector('.icon-container');
            iconContainer.classList.remove(iconBg);
            iconContainer.classList.add('bg-surface-container');
            
            // Revert Icons inside container
            const icons = iconContainer.querySelectorAll('.material-symbols-outlined');
            icons.forEach(icon => {
                icon.classList.remove(iconText);
            });

            // Hide Checkmark
            const indicator = card.querySelector('.selection-indicator');
            indicator.classList.remove('opacity-100', 'scale-100');
            indicator.classList.add('opacity-0', 'scale-50');
            
            card.setAttribute('aria-pressed', 'false');
        }

        function setCardActiveStyles(card) {
            const activeBg = card.getAttribute('data-active-bg');
            const activeText = card.getAttribute('data-active-text');
            const iconBg = card.getAttribute('data-icon-bg');
            const iconText = card.getAttribute('data-icon-text');
            
            // Apply Container
            card.classList.remove('bg-surface-container-lowest', 'shadow-sm');
            card.classList.add(activeBg, 'shadow-md');
            
            // Apply Text
            const title = card.querySelector('.title-text');
            const desc = card.querySelector('.desc-text');
            title.classList.remove('text-on-surface');
            title.classList.add(activeText);
            desc.classList.remove('text-on-surface-variant');
            desc.classList.add(activeText);

            // Apply Icon Container
            const iconContainer = card.querySelector('.icon-container');
            iconContainer.classList.remove('bg-surface-container');
            iconContainer.classList.add(iconBg);
            
            // Apply Icons inside container
            const icons = iconContainer.querySelectorAll('.material-symbols-outlined');
            icons.forEach(icon => {
                icon.classList.add(iconText);
            });

            // Show Checkmark
            const indicator = card.querySelector('.selection-indicator');
            indicator.classList.remove('opacity-0', 'scale-50');
            indicator.classList.add('opacity-100', 'scale-100');
            
            card.setAttribute('aria-pressed', 'true');
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // If clicking the already selected card, do nothing
                if (selectedLevel === card.getAttribute('data-level')) return;

                // Reset all
                cards.forEach(resetCardStyles);

                // Set active
                setCardActiveStyles(card);
                selectedLevel = card.getAttribute('data-level');

                // Enable button with playful pop
                if (startBtn.disabled) {
                    startBtn.disabled = false;
                    startBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'shadow-none');
                    startBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'shadow-primary/20', 'border-b-[3px]', 'border-on-primary-fixed-variant');
                    
                    // Simple pop animation
                    startBtn.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        startBtn.style.transform = 'scale(1)';
                    }, 150);
                }
            });
        });
    });
</script></main></body></html>
