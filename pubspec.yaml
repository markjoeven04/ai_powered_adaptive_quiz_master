name: brightspark_self_review
description: "BrightSpark Self-Review - AI-Powered Adaptive Quiz Master for K-12"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  confetti: ^0.7.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_spark.png"
  web:
    generate: true
    image_path: "assets/images/logo_spark.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
