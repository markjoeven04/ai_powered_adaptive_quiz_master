<script>
  function selectOption(selectedBtn) {
    // Reset all
    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.classList.remove('ring-2', 'ring-primary', 'bg-primary-fixed', 'shadow-[0_8px_24px_rgba(0,88,190,0.15)]', 'scale-[1.02]');
      btn.classList.add('bg-surface-container-lowest');
      
      const letter = btn.querySelector('.option-letter');
      letter.classList.remove('bg-primary', 'text-on-primary');
      letter.classList.add('bg-surface-container', 'text-on-surface-variant');
      
      const check = btn.querySelector('.check-icon');
      check.classList.remove('opacity-100', 'scale-100');
      check.classList.add('opacity-0', 'scale-50');
    });

    // Animate selected
    selectedBtn.classList.add('ring-2', 'ring-primary', 'bg-primary-fixed', 'shadow-[0_8px_24px_rgba(0,88,190,0.15)]', 'scale-[1.02]');
    selectedBtn.classList.remove('bg-surface-container-lowest');
    
    const letter = selectedBtn.querySelector('.option-letter');
    letter.classList.add('bg-primary', 'text-on-primary');
    letter.classList.remove('bg-surface-container', 'text-on-surface-variant');

    const check = selectedBtn.querySelector('.check-icon');
    check.classList.add('opacity-100', 'scale-100');
    check.classList.remove('opacity-0', 'scale-50');

    // Show action bar
    document.getElementById('action-bar').classList.remove('translate-y-full');
  }
